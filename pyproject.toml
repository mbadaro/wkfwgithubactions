[project]
name = "minha-api"
version = "0.1.0"
description = "API FastAPI inicial"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: ordenacao de imports,
# UP: sintaxe moderna, B: bugs comuns
select = ["E", "W", "F", "I", "UP", "B"]
